<div id="__ROOT_ID__">
  <style>
    #__ROOT_ID__ { color: var(--foreground); }
    #__ROOT_ID__ .approval-progress { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
    #__ROOT_ID__ .approval-bindings { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    #__ROOT_ID__ .approval-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr)); gap: 0.4rem; margin-bottom: 1rem; }
    #__ROOT_ID__ .approval-cell[data-choice="0"] { background: color-mix(in srgb, var(--viz-series-1) 18%, transparent); }
    #__ROOT_ID__ .approval-cell[data-choice="1"] { background: color-mix(in srgb, var(--viz-series-2) 18%, transparent); }
    #__ROOT_ID__ .approval-cell[data-choice="2"] { background: color-mix(in srgb, var(--viz-series-3) 18%, transparent); }
    #__ROOT_ID__ .approval-cell[data-choice="3"] { background: color-mix(in srgb, var(--viz-series-4) 18%, transparent); }
    #__ROOT_ID__ .approval-cell[data-choice="4"] { background: color-mix(in srgb, var(--viz-series-5) 18%, transparent); }
    #__ROOT_ID__ .approval-detail dl { display: grid; grid-template-columns: minmax(8rem, 0.28fr) 1fr; gap: 0.45rem 0.8rem; margin: 0.9rem 0; }
    #__ROOT_ID__ .approval-detail dt { color: var(--muted-foreground); }
    #__ROOT_ID__ .approval-detail dd { margin: 0; white-space: pre-wrap; }
    #__ROOT_ID__ .approval-note { margin-top: 0.75rem; }
    #__ROOT_ID__ .approval-actions { margin-top: 0.75rem; }
    #__ROOT_ID__ .approval-submit { margin-top: 1rem; justify-content: space-between; }
    #__ROOT_ID__ .approval-error { min-height: 1.4em; margin-top: 0.4rem; }
    #__ROOT_ID__ .approval-empty { margin: 0; }
    @media (max-width: 520px) {
      #__ROOT_ID__ .approval-detail dl { grid-template-columns: 1fr; gap: 0.2rem; }
      #__ROOT_ID__ .approval-detail dd { margin-bottom: 0.55rem; }
    }
  </style>

  <script type="application/json" data-approval-data>__SHEET_JSON__</script>

  <div class="approval-bindings text-small" data-bindings></div>
  <div class="approval-progress" aria-live="polite">
    <strong data-progress></strong>
    <span data-current></span>
  </div>
  <div class="approval-grid" data-grid aria-label="Approval items"></div>

  <section class="card approval-detail" data-review-panel>
    <div class="viz-row">
      <h2 data-item-id></h2>
      <span class="viz-badge" data-status></span>
    </div>
    <p data-summary></p>
    <dl data-details></dl>
    <label class="form-label approval-note" data-note-label for="__ROOT_ID__-note"></label>
    <textarea id="__ROOT_ID__-note" class="form-control" rows="3" data-note></textarea>
    <div class="viz-controls approval-actions" data-actions aria-label="Disposition"></div>
    <p class="approval-error text-destructive text-small" data-error role="alert"></p>
    <div class="viz-row approval-submit">
      <div class="viz-row">
        <button type="button" class="btn btn-ghost" data-prev>Previous</button>
        <button type="button" class="btn btn-ghost" data-next>Next</button>
      </div>
      <button type="button" class="btn btn-primary" data-send disabled></button>
    </div>
  </section>

  <section class="card" data-closure-panel hidden>
    <p class="approval-empty" data-closure-state></p>
    <div class="viz-row approval-submit">
      <button type="button" class="btn btn-primary" data-close></button>
    </div>
    <p class="approval-error text-destructive text-small" data-closure-error role="alert"></p>
  </section>

  <script>
    (() => {
      const root = document.getElementById("__ROOT_ID__");
      const sheet = JSON.parse(root.querySelector("[data-approval-data]").textContent);
      const decisionById = Object.fromEntries(sheet.decisions.map((decision, index) => [decision.id, { ...decision, index }]));
      const openItems = sheet.items.filter(item => item.status !== "resolved");
      const items = sheet.presentation.mode === "open-only" ? openItems : sheet.items;
      const local = Object.fromEntries(items.map(item => [item.id, { decision: null, note: "" }]));
      let selected = 0;

      const reviewPanel = root.querySelector("[data-review-panel]");
      const closurePanel = root.querySelector("[data-closure-panel]");
      const grid = root.querySelector("[data-grid]");
      const note = root.querySelector("[data-note]");
      const error = root.querySelector("[data-error]");
      const send = root.querySelector("[data-send]");

      function createText(tag, value) {
        const node = document.createElement(tag);
        node.textContent = value;
        return node;
      }

      function renderBindings() {
        const container = root.querySelector("[data-bindings]");
        container.replaceChildren(...sheet.bindings.map(binding => {
          const span = document.createElement("span");
          const strong = createText("strong", binding.label + ": ");
          span.append(strong, document.createTextNode(binding.value));
          return span;
        }));
      }

      function reviewedItems() {
        return items.filter(item => local[item.id].decision !== null);
      }

      function invalidReviewedItems() {
        return reviewedItems().filter(item => {
          const entry = local[item.id];
          return decisionById[entry.decision].requires_note && !entry.note;
        });
      }

      function saveDraft() {
        if (!items.length || items[selected].status === "resolved") return;
        local[items[selected].id].note = note.value.trim();
      }

      function moveToNextOpen() {
        for (let offset = 1; offset <= items.length; offset += 1) {
          const candidate = (selected + offset) % items.length;
          const item = items[candidate];
          if (item.status !== "resolved" && local[item.id].decision === null) {
            selected = candidate;
            return;
          }
        }
      }

      function renderGrid() {
        grid.replaceChildren(...items.map((item, index) => {
          const button = document.createElement("button");
          const entry = local[item.id];
          const decision = entry.decision ? decisionById[entry.decision] : null;
          button.type = "button";
          button.className = "btn viz-tile approval-cell";
          button.textContent = item.id;
          if (decision) button.dataset.choice = String(decision.index % 5);
          button.setAttribute("aria-label", item.id + ": " + item.summary + "; " + (decision ? decision.label : item.status_label));
          button.setAttribute("aria-pressed", index === selected ? "true" : "false");
          button.addEventListener("click", () => {
            saveDraft();
            selected = index;
            render();
          });
          return button;
        }));
      }

      function renderDetails(item) {
        const list = root.querySelector("[data-details]");
        const rows = [...item.details];
        if (item.dependencies.length) rows.push({ label: "Dependencies", value: item.dependencies.join(", ") });
        if (item.reopened_reason) rows.push({ label: "Why reopened", value: item.reopened_reason });
        list.replaceChildren(...rows.flatMap(row => [createText("dt", row.label), createText("dd", row.value)]));
      }

      function renderActions(item) {
        const container = root.querySelector("[data-actions]");
        if (item.status === "resolved") {
          container.replaceChildren();
          return;
        }
        const buttons = item.allowed_decisions.map(decisionId => {
          const definition = decisionById[decisionId];
          const button = document.createElement("button");
          button.type = "button";
          button.className = "btn";
          button.textContent = definition.label;
          button.dataset.decision = definition.id;
          button.setAttribute("aria-pressed", local[item.id].decision === definition.id ? "true" : "false");
          button.addEventListener("click", () => selectDecision(definition));
          return button;
        });
        const clear = document.createElement("button");
        clear.type = "button";
        clear.className = "btn btn-ghost";
        clear.textContent = "Clear";
        clear.addEventListener("click", () => {
          local[item.id] = { decision: null, note: "" };
          render();
        });
        container.replaceChildren(...buttons, clear);
      }

      function selectDecision(definition) {
        saveDraft();
        const item = items[selected];
        const entry = local[item.id];
        if (definition.requires_note && !entry.note) {
          error.textContent = "Enter the required response before choosing " + definition.label + ".";
          note.focus();
          return;
        }
        entry.decision = definition.id;
        moveToNextOpen();
        render();
      }

      function renderDetail() {
        const item = items[selected];
        const locked = item.status === "resolved";
        root.querySelector("[data-item-id]").textContent = item.id;
        root.querySelector("[data-status]").textContent = item.status_label;
        root.querySelector("[data-summary]").textContent = item.summary;
        renderDetails(item);
        root.querySelector("[data-note-label]").textContent = sheet.presentation.note_label;
        note.placeholder = sheet.presentation.note_placeholder;
        note.value = locked ? (item.response ? item.response.note : "") : local[item.id].note;
        note.disabled = locked;
        renderActions(item);
        error.textContent = "";
      }

      function renderProgress() {
        const reviewed = reviewedItems().length;
        const invalid = invalidReviewedItems().length;
        const reviewableCount = items.filter(item => item.status !== "resolved").length;
        root.querySelector("[data-progress]").textContent = reviewed + " of " + reviewableCount + " reviewed";
        root.querySelector("[data-current]").textContent = items.length ? items[selected].id + " selected" : "";
        send.disabled = reviewed === 0 || invalid > 0;
        send.textContent = reviewed ? sheet.presentation.submit_label + " (" + reviewed + ")" : sheet.presentation.submit_label;
      }

      function renderReview() {
        reviewPanel.hidden = false;
        closurePanel.hidden = true;
        grid.hidden = false;
        renderGrid();
        renderDetail();
        renderProgress();
      }

      function renderClosure() {
        reviewPanel.hidden = true;
        grid.hidden = true;
        closurePanel.hidden = false;
        root.querySelector("[data-progress]").textContent = "All " + sheet.items.length + " items resolved";
        root.querySelector("[data-current]").textContent = "Final closure pending";
        root.querySelector("[data-closure-state]").textContent = sheet.gate.ready_state + "; item review is complete.";
        root.querySelector("[data-close]").textContent = sheet.submission.closure_label;
      }

      function renderCompleted() {
        reviewPanel.hidden = true;
        grid.hidden = true;
        closurePanel.hidden = false;
        root.querySelector("[data-progress]").textContent = "All " + sheet.items.length + " items resolved";
        root.querySelector("[data-current]").textContent = sheet.gate.final_closure === "confirmed" ? "Final closure confirmed" : "No closure required";
        root.querySelector("[data-closure-state]").textContent = sheet.gate.ready_state;
        root.querySelector("[data-close]").hidden = true;
      }

      function envelope(lines) {
        return [
          sheet.submission.instruction,
          "Approval sheet: " + sheet.sheet_id,
          "Revision: " + sheet.revision,
          ...sheet.submission.rules,
          "",
          ...lines
        ].join("\n");
      }

      function render() {
        if (!openItems.length && sheet.gate.closure_required && sheet.gate.final_closure === "pending") {
          renderClosure();
        } else if (items.length) {
          renderReview();
        } else {
          renderCompleted();
        }
      }

      note.addEventListener("input", saveDraft);
      root.querySelector("[data-prev]").addEventListener("click", () => {
        saveDraft();
        selected = (selected - 1 + items.length) % items.length;
        render();
      });
      root.querySelector("[data-next]").addEventListener("click", () => {
        saveDraft();
        selected = (selected + 1) % items.length;
        render();
      });

      send.addEventListener("click", async () => {
        saveDraft();
        if (invalidReviewedItems().length) {
          error.textContent = "Complete the required response for every selected disposition before submitting.";
          renderProgress();
          return;
        }
        const lines = reviewedItems().map(item => {
          const entry = local[item.id];
          const command = decisionById[entry.decision].command;
          return item.id + " " + command + (entry.note ? ": " + entry.note : "");
        });
        if (window.openai?.sendFollowUpMessage) {
          await window.openai.sendFollowUpMessage({
            prompt: envelope(lines),
            title: "Submit " + lines.length + " approval disposition" + (lines.length === 1 ? "" : "s")
          });
        } else {
          error.textContent = "Codex submission is unavailable in this view.";
        }
      });

      root.querySelector("[data-close]").addEventListener("click", async () => {
        const closureError = root.querySelector("[data-closure-error]");
        if (window.openai?.sendFollowUpMessage) {
          await window.openai.sendFollowUpMessage({
            prompt: envelope([sheet.submission.closure_command]),
            title: "Submit final closure"
          });
        } else {
          closureError.textContent = "Codex submission is unavailable in this view.";
        }
      });

      renderBindings();
      render();
    })();
  </script>
</div>
